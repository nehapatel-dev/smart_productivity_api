services:
  - type: web
    name: smart-productivity-api
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: smart-productivity-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-frontend.example.com"

databases:
  - name: smart-productivity-db
    plan: free
