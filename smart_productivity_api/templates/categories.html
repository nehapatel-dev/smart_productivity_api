<!DOCTYPE html>
<html>

<head>

    <title>Categories</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            background:#f4f6f9;
        }

        .container{
            width:500px;
            margin:50px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px rgba(0,0,0,0.1);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            margin-top:10px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:none;
            background:#007bff;
            color:white;
            border-radius:8px;
            cursor:pointer;
        }

        button:hover{
            background:#0056b3;
        }

        .category{
            background:#eef3ff;
            padding:12px;
            margin-top:10px;
            border-radius:8px;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>My Categories</h2>

    <form method="POST">

        {% csrf_token %}

        <input type="text"
               name="name"
               placeholder="Enter category name"
               required>

        <button type="submit">
            Add Category
        </button>

    </form>

    <hr>

    {% for category in categories %}

        <div class="category">

            {{ category.name }}

        </div>

    {% endfor %}

</div>

</body>
</html>
