{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">


    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .register-box{
            background:white;
            padding:40px;
            width:350px;
            border-radius:15px;
            box-shadow:0px 0px 20px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            color:#333;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;
        }

        button{
            width:100%;
            padding:12px;
            margin-top:20px;
            background:#667eea;
            border:none;
            color:white;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#5a67d8;
        }

        .success{
            color:green;
            text-align:center;
            margin-top:15px;
        }

        .error{
            color:red;
            text-align:center;
            margin-top:15px;
        }

    </style>
</head>

<body>

<div class="register-box">

    <h2>Create Account</h2>

    <form method="POST">

        {% csrf_token %}

        <input type="text" name="username" placeholder="Username" required>

        <input type="email" name="email" placeholder="Email" required>

        <input type="password" name="password" placeholder="Password" required>

        <input type="password" name="password2" placeholder="Confirm Password" required>

        <button type="submit">Register</button>

    </form>

    {% if success %}
        <div class="success">
            Registration Successful
        </div>
    {% endif %}

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

</div>

</body>
</html>
